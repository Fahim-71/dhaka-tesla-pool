server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API calls go to the api container. Same origin for the browser: no CORS.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /driver/history) serve index.html
  # and React Router shows the right screen.
  location / {
    try_files $uri /index.html;
  }
}
