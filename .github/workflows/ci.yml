name: CI

on:
  push:
    branches: [master, pre-release, 'release/**', 'feature/**']
  pull_request:

jobs:
  api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teslapool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teslapool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: docker compose up (smoke test)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack exactly as an evaluator would
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Health check through nginx
        run: curl --fail --silent http://localhost:8080/api/health
      - name: Seeded cast can log in through the web container
        run: |
          curl --fail --silent -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"jashim@teslapool.test","password":"teslapool123"}' | grep -q '"role":"DRIVER"'
      - name: SPA routes fall back to index.html
        run: curl --fail --silent http://localhost:8080/driver/history | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
